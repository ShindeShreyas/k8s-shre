apiVersion: v1
kind: Pod
metadata: 
  name: lb-pod
  labels:
    app: lb-ci
spec:
  container: 
  - name: apache-container
    images: apache2:latest
    ports:
      - name: apache-port
        containerPort: 80
---
apiVersion: v1
kind: service
matadata:
  name: lb-services
  labels:
    app: lb-ci
    env: dev
spec:
  type: LoadBalancer
  selector:
    app: lb-ci
  ports:
    - name: ci-svc-pod
      port: 80
      targetPort: 80