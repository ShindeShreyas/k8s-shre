apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-deployment
  labels:
    app: rq

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rq

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: rq

    spec:
      containers:
        - name: nginx-cont
          image: nginx:latest

          ports:
            - name: nginx-cont
              containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: deploy-svc
  labels:
    app: rq

spec:
  type: NodePort

  selector:
    app: rq

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001