apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler 
metadata:  
  name: mobile-hpa 
  labels: 
    app: mobile
spec: 
  scaleTargetRef: 
    apiVersion: apps/v1 
    kind: Deployment 
    name: mobile-deployment 
  minReplicas: 2 
  maxReplicas: 5
  metrics: 
  - type: Resource 
    resource: 
      name: CPU 
      target: 
        type: Utilization 
        averageUtilization: 50