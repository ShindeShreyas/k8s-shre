apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-ss
  labels:
    app: ss

spec:
  replicas: 3
  selector:
    matchLabels:
      app: ss

  template:
    metadata:
      labels:
        app: ss

    spec:
     containers:
      - name: nmysql-cont
        image: mysql:8.0
        ports: 
          - containerPort: 3306

        env:
          - name: MYSQL_ROOT_PASSWORD
            value: root 
          - name: MYSQL_USER
            value: "admin"
          - name: MYSQL_PASSWORD
            value: "admin"
          - name: MYSQL_DATABASE
            value: "student_db" 